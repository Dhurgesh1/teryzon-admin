<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcements | Teryzon Admin</title><link rel="stylesheet" href="/admin/admin.css"><script src="../assets/js/theme-early.js"></script></head><body><main class="admin-main"><a class="admin-button secondary" href="/admin">Back to dashboard</a><header class="admin-topbar" style="margin-top:28px"><div><span class="admin-kicker">Website</span><h1 class="admin-title">Announcements</h1><p class="admin-subtitle">Create and publish updates for the Teryzon website.</p></div></header><section class="admin-section"><form id="announcement-form"><label class="admin-card-label">Title<input id="title" required style="display:block;background:#0d0908;border:1px solid var(--admin-line);color:var(--admin-ink);font:inherit;margin:8px 0 16px;padding:12px;width:100%"></label><label class="admin-card-label">Content<textarea id="content" required rows="5" style="display:block;background:#0d0908;border:1px solid var(--admin-line);color:var(--admin-ink);font:inherit;margin:8px 0 16px;padding:12px;width:100%"></textarea></label><label class="admin-card-label">Type<select id="type" style="display:block;background:#0d0908;border:1px solid var(--admin-line);color:var(--admin-ink);font:inherit;margin:8px 0 16px;padding:12px;width:100%"><option>Announcement</option><option>Update</option><option>Maintenance</option><option>Feature</option><option>Alert</option><option>News</option></select></label><button class="admin-button" type="submit">Publish announcement</button><p id="status" class="admin-subtitle" role="status"></p></form></section></main><script type="module">import {supabase} from '../assets/js/supabase-auth.js';const form=document.querySelector('#announcement-form'),status=document.querySelector('#status');const {data:{user}}=await supabase.auth.getUser();if(!user)location.replace('/login');else{const {data:p}=await supabase.from('profiles').select('role').eq('id',user.id).single();if(!p||!['admin','super_admin'].includes(p.role)){status.textContent='Access denied';form.remove();}else form.addEventListener('submit',async(e)=>{e.preventDefault();status.textContent='Publishing...';const {error}=await supabase.from('announcements').insert({title:title.value,content:content.value,type:type.value,status:'Published',created_by:user.id,publish_at:new Date().toISOString()});status.textContent=error?'Unable to publish announcement right now.':'Announcement published.';if(!error)form.reset();});}</script></body></html>
