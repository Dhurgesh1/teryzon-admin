<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Tickets | Teryzon Admin</title><link rel="stylesheet" href="/admin/admin.css"><link rel="stylesheet" href="../assets/css/theme.css"><script src="../assets/js/theme-early.js"></script></head><body><main class="admin-main"><a class="admin-button secondary" href="/admin">Back to dashboard</a><header class="admin-topbar" style="margin-top:28px"><div><span class="admin-kicker">Customer management</span><h1 class="admin-title">Support tickets</h1><p class="admin-subtitle">Review customer requests and update their status.</p></div></header><section class="admin-section"><div class="admin-section-heading"><h2>All tickets</h2><span id="ticket-status">Loading tickets...</span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Ticket</th><th>Customer</th><th>Category</th><th>Priority</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="tickets"><tr><td colspan="7" class="admin-loading">Loading tickets...</td></tr></tbody></table></div></section></main><script type="module">
import {supabase} from '../assets/js/supabase-auth.js';const body=document.querySelector('#tickets'),label=document.querySelector('#ticket-status');const date=(v)=>new Date(v).toLocaleDateString();const load=async()=>{const {data,error}=await supabase.from('support_tickets').select('id,ticket_number,name,email,category,priority,status,created_at').order('created_at',{ascending:false});if(error){label.textContent='Unable to load tickets';body.innerHTML='<tr><td colspan="7" class="admin-error">Unable to load tickets right now.</td></tr>';return;}label.textContent=`${data.length} ticket${data.length===1?'':'s'}`;body.innerHTML=data.length?data.map(t=>`<tr><td>${t.ticket_number}</td><td>${t.name}<small>${t.email}</small></td><td>${t.category}</td><td>${t.priority}</td><td><select data-id="${t.id}" class="ticket-status"><option ${t.status==='Open'?'selected':''}>Open</option><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Waiting for Customer'?'selected':''}>Waiting for Customer</option><option ${t.status==='Resolved'?'selected':''}>Resolved</option><option ${t.status==='Closed'?'selected':''}>Closed</option></select></td><td>${date(t.created_at)}</td><td><button class="admin-button" data-save="${t.id}" type="button">Save</button></td></tr>`).join(''):'<tr><td colspan="7" class="admin-empty">No support tickets yet.</td></tr>';};body.addEventListener('click',async(e)=>{const id=e.target.dataset.save;if(!id)return;const select=document.querySelector(`select[data-id="${id}"]`);e.target.disabled=true;const {error}=await supabase.from('support_tickets').update({status:select.value,updated_at:new Date().toISOString(),resolved_at:['Resolved','Closed'].includes(select.value)?new Date().toISOString():null}).eq('id',id);e.target.disabled=false;if(!error)load();});const {data:{user}}=await supabase.auth.getUser();if(!user)location.replace('/login');else{const {data:p}=await supabase.from('profiles').select('role').eq('id',user.id).single();if(!p||!['admin','super_admin'].includes(p.role))label.textContent='Access denied';else load();}
</script></body></html>
