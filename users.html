<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users | Teryzon Admin</title><link rel="stylesheet" href="/admin/admin.css"><script src="../assets/js/theme-early.js"></script></head><body><main class="admin-main"><a class="admin-button secondary" href="/admin">Back to dashboard</a><header class="admin-topbar" style="margin-top:28px"><div><span class="admin-kicker">Customer management</span><h1 class="admin-title">Users</h1><p class="admin-subtitle">Review registered profiles and access roles.</p></div></header><section class="admin-section"><div class="admin-section-heading"><h2>Registered profiles</h2><span id="user-status">Loading users...</span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th></tr></thead><tbody id="users"><tr><td colspan="4" class="admin-loading">Loading users...</td></tr></tbody></table></div></section></main><script type="module">import {supabase} from '../assets/js/supabase-auth.js';const body=document.querySelector('#users'),label=document.querySelector('#user-status');const {data:{user}}=await supabase.auth.getUser();if(!user)location.replace('/login');else{const {data:p}=await supabase.from('profiles').select('role').eq('id',user.id).single();if(!p||!['admin','super_admin'].includes(p.role)){label.textContent='Access denied';}else{const {data,error}=await supabase.from('profiles').select('full_name,email,role,created_at').order('created_at',{ascending:false});if(error){label.textContent='Unable to load users';return;}label.textContent=`${data.length} users`;body.innerHTML=data.length?data.map(item=>`<tr><td>${item.full_name||'Unnamed'}</td><td>${item.email}</td><td>${item.role}</td><td>${new Date(item.created_at).toLocaleDateString()}</td></tr>`).join(''):'<tr><td colspan="4" class="admin-empty">No users found.</td></tr>';}}</script></body></html>
